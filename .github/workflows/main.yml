
name: Deploy Node.js Project to AWS VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Production

    steps:
    - name: Run Deployment on Production
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_VPS }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH }}
        script: |
          echo "Navigating to project directory..."
          cd ${{ secrets.PROJECT_PATH }}
          echo "Resetting and pulling latest code..."
          git fetch --all
          git reset --hard origin/${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          echo "Writing .env file..."
          echo "${{ secrets.ENV  }}" > .env
          echo "Installing dependencies with NPM..."
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          npm run build
          
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    name: Deploy to Staging

    steps:
    - name: Run Deployment on Staging
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_VPS }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH }}
        script: |
          echo "Navigating to project directory..."
          cd ${{ secrets.PROJECT_PATH_DEV }}
          echo "Resetting and pulling latest code..."
          git fetch --all
          git reset --hard origin/${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}
          echo "Writing .env file..."
          echo "${{ secrets.ENV_DEV  }}" > .env
          echo "Installing dependencies with NPM..."
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
          npm run build
